# Lite 形态部署：单机单进程，WeKnora 作检索/解析底座（不需要 RAGFlow 外部网络）。
# 适用于客户内网 POC / 小规模试用：一台机器即可跑通全部功能。
#
# 与 deploy/test/docker-compose.yml 的差异：
# - 检索/入库底座固定 WeKnora（RETRIEVE_DRIVER=weknora, INGEST_SINK=weknora），不依赖 RAGFlow 外部网络
# - OIDC 默认开启（OIDC_ENABLED=true），不再用 BFF_DEV_MODE 固定主体
# - 所有持久化数据落单卷 ./lite-data/，便于备份与迁移
# - wecom-sync 内存用户仓库启动时从 CSV 加载（后续可换 DB Bean）
#
# 启动：cp deploy/test/lite.env.example .env && docker compose -f docker-compose.lite.yml up -d
name: hangli-lite

services:
  retrieval-proxy:
    build:
      context: ../..
      dockerfile: deploy/test/python-service.Dockerfile
      args: { SERVICE: retrieval-proxy, MODULE: "retrieval_proxy.app:create_app_from_env --factory" }
    environment:
      RETRIEVE_DRIVER: weknora
      WEKNORA_BASE_URL: ${WEKNORA_BASE_URL}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY}
      WEKNORA_TENANT_ID: ${WEKNORA_TENANT_ID}
      WEKNORA_CACHE_TTL_SECONDS: ${WEKNORA_CACHE_TTL_SECONDS:-60}
      AUDIT_LOG_PATH: /var/data/audit/retrieval.jsonl
    volumes:
      - ./lite-data:/var/data
    restart: unless-stopped
    networks: [lite]

  decide:
    build:
      context: ../..
      dockerfile: deploy/test/python-service.Dockerfile
      args: { SERVICE: decide, MODULE: "decide.app:app" }
    environment:
      DECIDE_RETRIEVAL_BASE_URL: http://retrieval-proxy:8000
      DECIDE_BACKEND: ${DECIDE_BACKEND:-rule}
      DECIDE_ENTITY_VOCAB: ${DECIDE_ENTITY_VOCAB:-}
    depends_on: [retrieval-proxy]
    networks: [lite]
    restart: unless-stopped

  gateway:
    build:
      context: ../..
      dockerfile: deploy/test/python-service.Dockerfile
      args: { SERVICE: gateway, MODULE: "gateway.api:app" }
    environment:
      GATEWAY_ROUTING_PATH: /conf/routing.yaml
      GATEWAY_DEEPSEEK_API_KEY: ${GATEWAY_DEEPSEEK_API_KEY:-}
      GATEWAY_DEEPSEEK_ENTERPRISE_API_KEY: ${GATEWAY_DEEPSEEK_ENTERPRISE_API_KEY:-}
      GATEWAY_QWEN_ENTERPRISE_API_KEY: ${GATEWAY_QWEN_ENTERPRISE_API_KEY:-}
      GATEWAY_VPC_API_KEY: ${GATEWAY_VPC_API_KEY:-}
      GATEWAY_USAGE_DB_PATH: /var/data/usage/gateway.sqlite
      GATEWAY_AUDIT_LOG_PATH: /var/data/audit/gateway.jsonl
      MCP_ENDPOINTS: ${MCP_ENDPOINTS:-}
      MCP_RETRIEVAL_URL: http://retrieval-proxy:8000
    volumes:
      - ./gateway-routing.yaml:/conf/routing.yaml:ro
      - ./lite-data:/var/data
    networks: [lite]
    restart: unless-stopped

  nl2sql:
    build:
      context: ../..
      dockerfile: deploy/test/python-service.Dockerfile
      args: { SERVICE: nl2sql, MODULE: "nl2sql.app:app" }
    environment:
      NL2SQL_DICT_PATH: /app/data/metrics.yaml
      NL2SQL_DB_PATH: /var/data/nl2sql/metrics.sqlite
    volumes:
      - ./lite-data:/var/data
    networks: [lite]
    restart: unless-stopped

  ingest:
    build:
      context: ../..
      dockerfile: deploy/test/ingest.Dockerfile
    environment:
      INGEST_SINK: weknora
      WEKNORA_BASE_URL: ${WEKNORA_BASE_URL}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY}
      WEKNORA_TENANT_ID: ${WEKNORA_TENANT_ID}
      WEKNORA_PARSE_TIMEOUT_SECONDS: ${WEKNORA_PARSE_TIMEOUT_SECONDS:-600}
      WEKNORA_PARSE_POLL_SECONDS: ${WEKNORA_PARSE_POLL_SECONDS:-5}
      WEKNORA_EMBEDDING_MODEL: ${WEKNORA_EMBEDDING_MODEL}
      SPRING_CONFIG_ADDITIONAL_LOCATION: /conf/
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 200MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 200MB
      INGEST_STORE_PATH: /var/data/ingest/documents.json
      INGEST_FILE_STORE_PATH: /var/data/filestore
    volumes:
      - ./ingest-application.yml:/conf/application.yml:ro
      - ./lite-data:/var/data
    networks: [lite]
    restart: unless-stopped

  matcher:
    build:
      context: ../..
      dockerfile: deploy/test/java-service.Dockerfile
      args: { SERVICE: matcher }
    environment:
      SERVER_PORT: 8010
      MATCHER_STORE_PATH: /var/data/matcher/store.json
      MATCHER_ENRICHMENT_ENABLED: "true"
      MATCHER_DECIDE_BACKEND: ${MATCHER_DECIDE_BACKEND:-lexical}
      RETRIEVAL_URL: http://retrieval-proxy:8000
      RETRIEVAL_KB_SCOPE: ${BFF_KB_SCOPE:-kb_finance,kb_audit}
      INGEST_URL: http://ingest:8030
    volumes:
      - ./lite-data:/var/data
    depends_on: [retrieval-proxy, ingest]
    networks: [lite]
    restart: unless-stopped

  packager:
    build:
      context: ../..
      dockerfile: deploy/test/java-service.Dockerfile
      args: { SERVICE: packager }
    environment:
      SERVER_PORT: 8080
      PACKAGER_STORAGE_TYPE: local
      PACKAGER_STORAGE_ROOT: /var/data/filestore
      PACKAGER_STORAGE_OUT_DIR: /var/data/packages
    volumes:
      - ./lite-data:/var/data
    networks: [lite]
    restart: unless-stopped

  wecom-sync:
    build:
      context: ../..
      dockerfile: deploy/test/java-service.Dockerfile
      args: { SERVICE: wecom-sync }
    environment:
      WECOM_SYNC_PORT: 8020
      IDENTITY_DEFAULT_MAX_SENSITIVITY: ${IDENTITY_DEFAULT_MAX_SENSITIVITY:-L2}
      IDENTITY_REQUIRE_ADMIN_TOKEN: ${IDENTITY_REQUIRE_ADMIN_TOKEN:-true}
      IDENTITY_ADMIN_TOKEN: ${IDENTITY_ADMIN_TOKEN:-}
      OIDC_ENABLED: "true"
      OIDC_ISSUER: ${OIDC_ISSUER}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_ALGORITHM: ${OIDC_ALGORITHM:-RS256}
      OIDC_HMAC_SECRET: ${OIDC_HMAC_SECRET:-}
      OIDC_PUBLIC_KEY_PEM: ${OIDC_PUBLIC_KEY_PEM:-}
    networks: [lite]
    restart: unless-stopped

  bff:
    build:
      context: ../..
      dockerfile: deploy/test/python-service.Dockerfile
      args: { SERVICE: bff, MODULE: "bff.app:app" }
    environment:
      BFF_IDENTITY_URL: http://wecom-sync:8020
      BFF_RETRIEVAL_URL: http://retrieval-proxy:8000
      BFF_DECIDE_URL: http://decide:8000
      BFF_GATEWAY_URL: http://gateway:8000
      BFF_INGEST_URL: http://ingest:8030
      BFF_MATCHER_URL: http://matcher:8010
      BFF_PACKAGER_URL: http://packager:8080
      BFF_DEV_MODE: "false"
      BFF_SESSION_COOKIE: ${BFF_SESSION_COOKIE:-shilian_id_token}
      BFF_ADMIN_ROLES: ${BFF_ADMIN_ROLES:-admin,it_admin}
      BFF_KB_SCOPE: ${BFF_KB_SCOPE:-kb_finance,kb_audit}
      BFF_INTERNAL_TOKEN: ${BFF_INTERNAL_TOKEN:-}
      BFF_TIMEOUT_SECONDS: ${BFF_TIMEOUT_SECONDS:-60}
      BFF_CONTEXT_SECRET: ${BFF_CONTEXT_SECRET:-}
      BFF_CONTEXT_COOKIE_SECURE: ${BFF_CONTEXT_COOKIE_SECURE:-false}
    depends_on: [retrieval-proxy, decide, gateway, ingest, matcher, packager, wecom-sync]
    networks: [lite]
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: deploy/test/web/Dockerfile
    ports:
      - "${WEB_PORT:-8088}:80"
    depends_on: [bff]
    networks: [lite]
    restart: unless-stopped

networks:
  lite: {}
