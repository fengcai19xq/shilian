# 与 web/vite.config.ts 的 dev proxy 规则一致：/api/decide、/api/retrieval 去掉 /api；/api/gateway 去掉 /api/gateway
server {
    listen 80;
    client_max_body_size 200m;
    root /usr/share/nginx/html;
    index index.html;

    location /api/decide/   { proxy_pass http://decide:8000/decide/; }
    location /api/retrieval/{ proxy_pass http://retrieval-proxy:8000/retrieval/; }
    location /api/gateway/  { proxy_pass http://gateway:8000/; }
    location /api/ingest/   { proxy_pass http://ingest:8030/ingest/; proxy_read_timeout 600s; }

    location / { try_files $uri /index.html; }
}
