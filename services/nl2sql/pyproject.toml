# NL2SQL 经营查数服务
# 只读视图 + 指标口径字典 + 自然语言到 SQL 翻译 + 只读执行
#
# 安全红线：
#   1. 只允许 SELECT，不允许 INSERT/UPDATE/DELETE/DDL
#   2. SQL 模板参数化，不允许字符串拼接
#   3. 密级校验：用户 max_sensitivity 必须 >= 指标 sensitivity
#   4. 结果行数上限 1000 行

[project]
name = "nl2sql"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "PyYAML>=6.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "pytest-asyncio>=0.23"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
