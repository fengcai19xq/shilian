spring.application.name=matcher
server.port=${MATCHER_PORT:8010}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# WK18 登记富化：成册闭环验收前保持关闭，避免未完成的候选属性链影响打分
matcher.enrichment.enabled=${MATCHER_ENRICHMENT_ENABLED:false}

# 清单/任务/结果/审计 JSON 快照；留空为纯内存
matcher.store.path=${MATCHER_STORE_PATH:}

# p(satisfies_item) 实现：lexical（默认，本地词面判定）| reject（全部待确认）
matcher.decide.backend=${MATCHER_DECIDE_BACKEND:lexical}
