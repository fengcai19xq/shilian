# 资料类型词典 v1：std_type -> 标准名称 + 别名 + 必备属性
# 命中别名才归一；词典没有的资料名称一律标 unknown，不猜。
#
# required_attributes 说明：
#   period:   是否需要期间（年份）—— 财务/审计/税务类必填
#   scope:    是否需要口径（合并/单体）—— 报表类必填
#   copies:   是否需要份数 —— 合同/证书类必填
#   stamped:  是否需要盖章 —— 几乎所有对外提交的文件必填
#   缺失字段在 matcher 硬约束判定中按不通过处理（constraints.py）
