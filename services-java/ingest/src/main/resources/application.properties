spring.application.name=ingest
server.port=${INGEST_PORT:8030}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

spring.servlet.multipart.max-file-size=${INGEST_MAX_FILE_SIZE:50MB}
spring.servlet.multipart.max-request-size=${INGEST_MAX_FILE_SIZE:50MB}

# 切块：按字符计，块之间重叠 overlap 个字符；块不跨页
ingest.chunk.size=${INGEST_CHUNK_SIZE:800}
ingest.chunk.overlap=${INGEST_CHUNK_OVERLAP:100}
# true：上传后后台线程解析（POST 立即返回 uploaded）；false：请求线程内同步完成
ingest.async=${INGEST_ASYNC:true}

# RAGFlow：凭据只从环境变量读取，仓库内不出现任何真实值。当前只有内存 Fake 实现
ingest.ragflow.base-url=${RAGFLOW_BASE_URL:}
ingest.ragflow.api-key=${RAGFLOW_API_KEY:}
ingest.ragflow.default-dataset=${RAGFLOW_DEFAULT_DATASET:kb_default}
# 部门 -> 数据集名称，例如 ingest.ragflow.dept-datasets[财务共享]=kb_finance；YAML 中非 ASCII 键需写成 "[财务共享]"（未配置的部门落到 default-dataset）
