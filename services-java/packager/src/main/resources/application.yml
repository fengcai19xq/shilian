spring:
  application:
    name: packager
  jackson:
    property-naming-strategy: SNAKE_CASE
server:
  port: ${SERVER_PORT:8080}
packager:
  storage:
    # local：挂进沙箱的临时目录；memory：内存实现（联调/演示用）
    type: ${PACKAGER_STORAGE_TYPE:local}
    # 与 ingest 的 INGEST_FILE_STORE_PATH 挂同一个卷，才能读取 local://docs/...
    root: ${PACKAGER_STORAGE_ROOT:${java.io.tmpdir}/shilian-packager/mnt}
    out-dir: ${PACKAGER_STORAGE_OUT_DIR:${java.io.tmpdir}/shilian-packager/out}
