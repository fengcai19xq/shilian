spring.application.name=wecom-sync
server.port=${WECOM_SYNC_PORT:8020}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# 企微凭据只从环境变量读取，仓库内不出现任何真实值
wecom.corp-id=${WECOM_CORP_ID:}
wecom.corp-secret=${WECOM_CORP_SECRET:}
wecom.base-url=${WECOM_BASE_URL:https://qyapi.weixin.qq.com}

# 无人工授权记录时的默认密级上限
identity.default-max-sensitivity=${IDENTITY_DEFAULT_MAX_SENSITIVITY:L2}
