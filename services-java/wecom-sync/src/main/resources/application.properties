spring.application.name=wecom-sync
server.port=${WECOM_SYNC_PORT:8020}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.default-property-inclusion=always

# 企微凭据只从环境变量读取，仓库内不出现任何真实值
wecom.corp-id=${WECOM_CORP_ID:}
wecom.corp-secret=${WECOM_CORP_SECRET:}
wecom.base-url=${WECOM_BASE_URL:https://qyapi.weixin.qq.com}

# 无人工授权记录时的默认密级上限
identity.default-max-sensitivity=${IDENTITY_DEFAULT_MAX_SENSITIVITY:L2}

# WeKnora 身份投影（WK14）。凭据只从环境变量读取，仓库内不出现任何真实值。
# enabled=false 时投影只返回计划、不触碰后端；开启前需先现场核对成员端点
weknora.enabled=${WEKNORA_PROJECTION_ENABLED:false}
weknora.base-url=${WEKNORA_BASE_URL:}
weknora.api-key=${WEKNORA_API_KEY:}
weknora.tenant-id=${WEKNORA_TENANT_ID:}
# KB 命名用的租户命名空间：sl-{tenant}-{密级}-{部门}，与 ingest / 检索侧同值
weknora.tenant=${WEKNORA_TENANT:default}
# 成员占位邮箱域名（企微邮箱不在同步范围，此处仅合成内部标识，不对外发送）
weknora.email-domain=${WEKNORA_EMAIL_DOMAIN:identity.shilian.local}
# 角色映射：命中 admin-roles → admin，命中 contributor-roles → contributor，其余一律 viewer（最小权限）
weknora.admin-roles=${WEKNORA_ADMIN_ROLES:financing_manager,it_admin}
weknora.contributor-roles=${WEKNORA_CONTRIBUTOR_ROLES:financing_staff}
