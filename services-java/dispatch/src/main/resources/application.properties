spring.application.name=shilian-dispatch
server.port=${DISPATCH_PORT:8012}
spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.deserialization.fail-on-unknown-properties=false

# 派单规则文件：classpath: 或 file: 前缀，可用环境变量覆盖
dispatch.routing-file=${DISPATCH_ROUTING_FILE:classpath:dispatch-routing.yml}
# 工单从指派（或被驳回）起超过多少小时未回传即提醒并升级到部门负责人
dispatch.timeout-hours=${DISPATCH_TIMEOUT_HOURS:48}
# 卡片消息里“去上传”按钮的链接前缀，最终为 {base}/{ticket_id}
dispatch.upload-url-base=${DISPATCH_UPLOAD_URL_BASE:http://localhost:5173/dispatch/tickets}
# 超时扫描间隔（毫秒）
dispatch.escalation.scan-interval-ms=${DISPATCH_SCAN_INTERVAL_MS:300000}
