name: ci

on:
  push:
    branches: [main, shilian-weknora]
  pull_request:

jobs:
  python:
    name: pytest (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [retrieval-proxy, gateway, decide, bff, matcher, packager, nl2sql]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        working-directory: services/${{ matrix.service }}
        run: pip install -e ".[dev]"
      - name: Test
        working-directory: services/${{ matrix.service }}
        run: python -m pytest -q

  web:
    name: web (test / typecheck / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Test
        working-directory: web
        run: pnpm test
      - name: Typecheck
        working-directory: web
        run: pnpm typecheck
      - name: Build
        working-directory: web
        run: pnpm build

  java:
    name: mvn test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [ingest, matcher, packager, wecom-sync]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test
        working-directory: services-java/${{ matrix.service }}
        run: mvn -q -B test
